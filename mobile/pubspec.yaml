name: photosync
description: Privacy-first local photo and video gallery application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management and navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking and authentication
  dio: ^5.10.0
  flutter_secure_storage: ^9.2.4

  # Local database
  drift: ^2.34.2
  sqlite3_flutter_libs: ^0.5.42

  # Device media
  photo_manager: ^3.10.0
  photo_view: ^0.15.0
  video_player: ^2.13.0

  # File and device access
  file_picker: ^8.3.7
  permission_handler: ^11.4.0
  path_provider: ^2.1.6

  # Image processing
  image: ^4.9.1
  flutter_image_compress: ^2.5.0

  # Sharing and security
  share_plus: ^10.1.4
  local_auth: ^2.3.0

  # Background tasks
  workmanager: ^0.9.0+3

  # Utilities
  intl: ^0.20.3
  uuid: ^4.6.0
  path: ^1.9.1
  crypto: ^3.0.7
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.34.5

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/ml_models/
