name: photosync
description: Privacy-first local gallery replacement.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1
  photo_manager: ^3.6.3
  photo_view: ^0.15.0
  video_player: ^2.9.2
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  crypto: ^3.0.6
  image: ^4.5.2
  flutter_image_compress: ^2.4.0
  workmanager: ^0.5.2
  local_auth: ^2.3.0
  share_plus: ^10.1.4
  file_picker: ^8.1.7
  collection: ^1.19.0
  intl: ^0.20.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.14

flutter:
  uses-material-design: true
  assets:
    - assets/ml_models/
